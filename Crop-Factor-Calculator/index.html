<!DOCTYPE html>
<html manifest="/Camera/manifest.appcache" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />

  <!-- <link type="application/manifest+json" rel="manifest" href="/Camera/manifest.webmanifest" /> -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/Camera/favicon.svg" />
  <link rel="apple-touch-icon" type="image/svg+xml" sizes="any" href="/Camera/favicon.svg" />
  <meta name="apple-mobile-web-app-title" content="" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-starturl" content="/Camera/" />
  <meta name="theme-color" content="#000000" />
  <title>Crop Factor Calculator</title>
  <script type="text/javascript" defer="defer" crossorigin="anonymous" referrerpolicy="no-referrer" src="https://cdn.jsdelivr.net/npm/core-js-bundle@latest/minified.min.js"></script>
  <script type="text/javascript" defer="defer" crossorigin="anonymous" referrerpolicy="no-referrer" src="https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js"></script>
  <script type="text/javascript" defer="defer" crossorigin="anonymous" referrerpolicy="no-referrer" src="script.js"></script>
  <link type="text/css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" />

  <style>
    h1 a {
      color: white;
      text-decoration: none;
    }

    #settings {
      width: -moz-fit-content;
      width: fit-content;
    }

    #settings td {
      vertical-align: middle;
      text-align: end;
      border: none;
    }

    #settings input {
      max-width: 100px;
    }
  </style>

</head>

<body>

  <div class="container">

    <div class="mt-3">
      <a href="../">Back</a>
      <h1>Crop Factor Calculator</h1>

      <table id="settings" class="table">
        <thead>
          <tr>
            <th>Sensor Size</th>
            <th>Crop Factor</th>
            <th>Focal Length</th>
            <th>Resolution</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><label>60x70 Medium Format:<br />60mm x 70mm<br />6:7</label></td>
            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="0.469" readonly="readonly" data-width="70" data-height="60"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>
          <tr>
            <td><label>60x45 Medium Format:<br />60mm x 45mm<br />4:3</label></td>
            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="0.577" readonly="readonly" data-width="60" data-height="45"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>
          <tr>

            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="0.644" readonly="readonly" data-width="54" data-height="40"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>
          <tr>
            <td><label>44x33 Medium Format:<br />44mm x 33mm<br />4:3</label></td>
            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="0.787" readonly="readonly" data-width="44" data-height="33"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>
          <tr class="selected">
            <td><label>Full Frame 35mm:<br />36mm x 24mm<br />3:2</label></td>
            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="1" readonly="readonly" data-width="36" data-height="24"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="50" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="60" min="1" step="1"></td>
          </tr>
          <tr>
            <td><label>APS-C:<br />24mm x 16mm<br />3:2</label></td>
            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="1.5" readonly="readonly" data-width="24" data-height="16"></td>
            <td><input type="number" class="form-control focal-length" placeholder="Focal Length" title="Focal Length" value="" min="1" step="1"></td>
            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>
          <tr>
            <td><label>Canon APS-C:<br />22mm x 15mm<br />3:2</label></td>

            <td><input type="number" class="form-control resolution" placeholder="Resolution" title="Resolution" value="" min="1" step="1"></td>
          </tr>

            <td><input type="number" class="form-control crop-factor" placeholder="Crop Factor" title="Crop Factor" value="2.72" readonly="readonly" data-width="13" data-height="9"></td>

          </tr>

      </table>
    </div>

  </div>

</html>
